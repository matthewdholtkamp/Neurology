name: Deploy site

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Strict build first: fails loudly on missing nav pages / broken links
      # instead of silently deploying an incomplete site.
      - run: mkdocs build --strict
      # Keep gh-pages current too, so the site works whichever branch Pages serves.
      - run: mkdocs gh-deploy --force
      # Pages serves main / (root): copy the built site into main and commit it.
      - name: Publish built site to main
        run: |
          bash tools/publish-to-main.sh site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Built site unchanged."
          else
            git commit -m "Publish built site [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
